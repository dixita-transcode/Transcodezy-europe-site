<!-- how to apply section start -->
<section id="how-to-apply" class="howtoapply-section">
  <!-- About Us content -->

  <div
    class="bg-[#FFFFFF] h-auto py-[50px] lg:py-[80px] xl:py-[100px] 2xl:py-[140px]"
  >
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col lg:flex-row gap-[40px] w-full">
        <div class="w-full xl:w-[643px]">
          <h5
            class="paragraph text-accent bg-[#FFFFFF0A] border border-accent w-fit py-3 px-6 rounded-[40px] text-center z-10"
          >
            How to Apply
          </h5>
          <div class="py-4">
            <h1 class="text-accent heading font-medium py-2 md:py-4">
              How to Apply
            </h1>
            <p class="paragraph text-secondary mt-2 md:mt-4">
              Interested in joining Transcodezy IT Solutions? Send your CV and a
              cover letter to:
            </p>
          </div>
        </div>
        <div>
          <div
            class="relative z-0 bg-[#0F1A24] flex flex-col gap-[40px] w-full max-w-3xl p-5 lg:p-10 rounded-[24px] h-[580px] w-full xl:w-[817px] shadow-lg"
          >
            <img
              src="../../../Assets/Images/Careers/howtoapply_form_bg.png"
              alt="howtoapply_form_bg"
              class="absolute z-10 inset-0 h-[100%] w-[100%] object-cover"
            />
            <h2 class="text-white text-[24px] font-medium">
              Apply Now – Start Your Journey at Transcodezy
            </h2>

            <form class="space-y-6 relative z-10">
              <!-- Row 1 -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <input
                  type="text"
                  placeholder="Full Name"
                  class="w-full p-3 rounded-xl bg-[#FFFFFF14] text-white placeholder-[#FFFFFF66] focus:outline-none focus:ring-2 focus:ring-primary z-10"
                />

                <input
                  type="email"
                  placeholder="Email Address"
                  class="w-full p-3 rounded-xl bg-[#FFFFFF14] text-white placeholder-[#FFFFFF66] focus:outline-none focus:ring-2 focus:ring-primary z-10"
                />
              </div>

              <!-- Row 2 -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <input
                  type="tel"
                  placeholder="Phone Number"
                  class="w-full p-3 rounded-xl bg-[#FFFFFF14] text-white placeholder-[#FFFFFF66] focus:outline-none focus:ring-2 focus:ring-primary z-10"
                />

                <!-- Position Applied Dropdown -->
                <div class="relative w-full lg:w-[335px] z-10">
                  <select
                    class="w-full appearance-none bg-[#FFFFFF14] text-[#FFFFFF66] rounded-xl p-3 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-primary cursor-pointer"
                  >
                    <option value="" disabled selected>Position Applied</option>
                    <option class="text-accent paragraph p-3">
                      Software Developer
                    </option>
                    <option class="text-accent paragraph p-3">
                      Cloud Engineer
                    </option>
                    <option class="text-accent paragraph p-3">
                      UI/UX Designer
                    </option>
                    <option class="text-accent paragraph p-3">
                      AI Engineer
                    </option>
                    <option class="text-accent paragraph p-3">Intern</option>
                    <option class="text-accent paragraph p-3">Other</option>
                  </select>

                  <!-- Custom dropdown arrow -->
                  <svg
                    class="w-5 h-5 text-[#FFFFFF66] absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 9l-7 7-7-7"
                    />
                  </svg>
                </div>
              </div>

              <!-- Row 3 -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <!-- Resume Upload -->
                <label
                  class="rounded-xl cursor-pointer bg-[#FFFFFF14] p-3 z-10"
                >
                  <p class="text-md text-[#FFFFFF66] text-start mb-2">
                    Upload Resume/CV
                  </p>
                  <div
                    class="flex flex-col items-center justify-center w-full h-[70px] text-[#FFFFFF66] rounded-lg border-2 border-dashed border-gray-600 hover:border-primary transition"
                  >
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                  </div>
                  <input id="resume" type="file" class="hidden" />
                </label>

                <!-- Message -->
                <textarea
                  placeholder="Message..."
                  class="w-full h-32 p-3 rounded-xl bg-[#FFFFFF14] text-white placeholder-[#FFFFFF66] focus:outline-none focus:ring-2 focus:ring-blue-500 z-10"
                ></textarea>
              </div>

              <!-- Row 4 -->
              <div class="relative w-full lg:w-[335px] z-10">
                <select
                  class="w-full appearance-none bg-[#FFFFFF14] text-[#FFFFFF66] rounded-xl p-3 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-primary cursor-pointer"
                >
                  <option value="" disabled selected>Work Type</option>
                  <option class="text-accent paragraph p-3">Remote</option>
                  <option class="text-accent paragraph p-3">On-site</option>
                  <option class="text-accent paragraph p-3">Hybrid</option>
                </select>

                <!-- Custom dropdown arrow -->
                <svg
                  class="w-5 h-5 text-[#FFFFFF66] absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </div>
              <!-- Submit Button -->
              <div class="text-center mt-5 ">
                <button type="submit"
                  class="w-fit px-6 py-3 bg-primary text-white rounded-[40px] hover:scale-110 duration-700 transition ">
                  Submit Application
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
