<!-- Blogs section start -->
<div class="bg-[#FFFFFF] h-auto py-16 sm:py-20 lg:py-[100px]">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Heading -->
    <div class="py-5 w-full ">
      <h5
        class="paragraph text-accent border border-accent w-fit py-3 px-6 rounded-[40px]"
      >
        Blog & Insights
      </h5>
    </div>
    <div class="none md:flex justify-between">
      <h2 class="text-accent heading font-medium py-4 lg:py-8">Recent Blogs</h2>
    </div>

    <!-- Tabs -->
    <div class="none md:flex flex-wrap gap-6 mb-4 md:mb-8">
      <button
        class="tab-btn text-primary paragraph border-b-2 border-primary w-[144px] mb-4 md:mb-0"
        data-tab="services"
      >
        Services
      </button>
      <button
        class="tab-btn paragraph text-secondary hover:text-primary w-[144px] mb-4 md:mb-0"
        data-tab="industries"
      >
        Industries
      </button>
      <button
        class="tab-btn paragraph text-secondary hover:text-primary w-[144px] mb-4 md:mb-0"
        data-tab="expertise"
      >
        Expertise
      </button>
    </div>
    <!-- Sub-Tabs for Expertise -->
    <div id="expertiseSection" class="hidden pb-6 ">
      <h2 class="text-[32px] text-accent font-medium mb-4">
        Discover our expertise experience
      </h2>
      <!-- Sub-Tabs for Expertise -->
      <div id="subTabs" class="none md:flex flex-wrap gap-6 w-full max-w-[1520px]">
        <button
          class="sub-tab-btn text-primary paragraph border-b-2 border-primary w-full md:w-[299px] mb-4 md:mb-0"
          data-subtab="custom_software_development"
        >
          Custom Software Development
        </button>
        <button
          class="sub-tab-btn paragraph text-secondary hover:text-primary w-full md:w-[157px] mb-4 md:mb-0"
          data-subtab="ui_ux_design"
        >
          UI/UX Design
        </button>
        <button
          class="sub-tab-btn paragraph text-secondary hover:text-primary w-full md:w-[305px] mb-4 md:mb-0"
          data-subtab="web_mobile_app_development"
        >
          Web & Mobile App Development
        </button>
        <button
          class="sub-tab-btn paragraph text-secondary hover:text-primary w-full md:w-[163px] mb-4 md:mb-0"
          data-subtab="crm_solutions"
        >
          CRM Solutions
        </button>
      </div>
    </div>


    <!-- Cards Container -->
    <div id="cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Default Cards (Services) will be loaded here by JS -->
    </div>
  </div>
</div>

<!-- JS Script -->
<script>
  const tabBtns = document.querySelectorAll(".tab-btn");
  const subTabBtns = document.querySelectorAll(".sub-tab-btn");
  const subTabs = document.getElementById("subTabs");
  const cardsContainer = document.getElementById("cards");


  function renderCards(data) {
    cardsContainer.innerHTML = data
      .map(
        (item) => `
      <div class="bg-white flex flex-col border border-[#1320281A] h-[540px] lg:h-[670px] xl:h-[564px] shadow-md rounded-2xl overflow-hidden p-3 lg:p-6">
        <img src="${item.img}" alt="${item.title}" class="w-full h-[300px] object-cover rounded-xl"/>
        <h3 class="font-medium text-accent text-2xl pt-3">${item.title}</h3>
        <p class="paragraph text-secondary flex-1 pt-2">${item.desc}</p>
        <button class="paragraph text-secondary font-medium  group hover:text-primary pt-2">
          <a href="${item.link}" class="flex justify-start items-center gap-2">
            Read More
            <span class="transition-transform duration-500 ease-in-out group-hover:rotate-[50deg]">
              <i class="fa-solid fa-arrow-right"></i>
            </span>
          </a>
        </button>
      </div>`
      )
      .join("");
  }
function loadCards(category) {
    if (category === "expertise") {
      expertiseSection.classList.remove("hidden");
      renderCards(blogs.expertise.custom_software_development);
    } else {
      expertiseSection.classList.add("hidden");
      renderCards(blogs[category]);
    }
  }

  // Default load
  loadCards("services");

  // Main tab click
  tabBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      tabBtns.forEach((b) =>
        b.classList.remove("text-primary", "border-b-2", "border-primary")
      );
      tabBtns.forEach((b) => b.classList.add("text-gray-600"));
      btn.classList.add("text-primary", "border-b-2", "border-primary");
      btn.classList.remove("text-gray-600");

      const category = btn.getAttribute("data-tab");
      loadCards(category);
    });
  });

  // Sub-tab click (for Expertise)
  subTabBtns.forEach((subBtn) => {
    subBtn.addEventListener("click", () => {
      subTabBtns.forEach((b) =>
        b.classList.remove("text-primary", "border-b-2", "border-primary")
      );
      subTabBtns.forEach((b) => b.classList.add("text-gray-600"));

      subBtn.classList.add("text-primary", "border-b-2", "border-primary");
      subBtn.classList.remove("text-gray-600");

      const subCategory = subBtn.getAttribute("data-subtab");
      renderCards(blogs.expertise[subCategory]);
    });
  });
</script>
