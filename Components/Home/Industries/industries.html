<!-- industries section start -->

<div class="bg-white py-[50px] lg:py-[80px] xl:py-[100px] 2xl:py-[140px]">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div>
      <div class="pb-4 w-full lg:w-[500px]">
        <h5
          class="paragraph text-accent bg-[#FFFFFF0A] border border-accent w-fit py-3 px-6 rounded-[40px] text-center z-10"
        >
          Industries
        </h5>
      </div>
      <div>
        <h2 class="text-accent heading font-medium">
          Industries We Empower in Europe
        </h2>
      </div>
      <div class="py-4 lg:py-8 grid grid-cols-1 lg:grid-cols-2 gap-5 lg:gap-10">
        <!-- Images -->
        <div class="relative" id="industryImages">
          <div>
            <img
              src="../../../Assets/Images/fintech_industries.jpg"
              alt="fintech"
              class="industry-img h-[400px] w-full rounded-2xl object-cover"
            />
          </div>
          <div class="hidden">
            <img
              src="../../../Assets/Images/manufacturing_industries.jpg"
              alt="Manufacturing"
              class="industry-img h-[400px] w-full rounded-2xl object-cover"
            />
          </div>
          <div class="hidden">
            <img
              src="../../../Assets/Images/healthcare_ind.jpg"
              alt="healthcare"
              class="industry-img h-[400px] w-full rounded-2xl object-cover"
            />
          </div>
          <div class="hidden">
            <img
              src="../../../Assets/Images/ecommerce_ind.jpg"
              alt="ecommerce"
              class="industry-img h-[400px] w-full rounded-2xl object-cover"
            />
          </div>
          <div class="hidden">
            <img
              src="../../../Assets/Images/educatin_tech.jpg"
              alt="education_tech"
              class="industry-img h-[400px] w-full rounded-2xl object-cover"
            />
          </div>
          <div class="hidden">
            <img
              src="../../../Assets/Images/sports_tech.jpg"
              alt="sports_tech"
              class="industry-img h-[400px] w-full rounded-2xl object-cover"
            />
          </div>
          <div class="hidden">
            <img
              src="../../../Assets/Images/social_media.jpg"
              alt="Social media"
              class="industry-img h-[400px] w-full rounded-2xl object-cover"
            />
          </div>
        </div>

        <!-- Buttons -->
        <div class="w-full" id="industryButtons">
          <button
            class="industry-btn border-b w-full text-start py-2"
            data-index="0"
          >
            <h2 class="text-2xl font-medium text-accent ">FinTech</h2>
            <p class="paragraph text-secondary">
              Secure banking apps, digital wallets, blockchain
            </p>
          </button>
          <button
            class="industry-btn border-b w-full text-start py-2"
            data-index="1"
          >
            <h2 class="text-2xl font-medium text-accent">Manufacturing</h2>
            <p class="paragraph text-secondary">IoT & smart ERP systems</p>
          </button>
          <button
            class="industry-btn border-b w-full text-start py-2"
            data-index="2"
          >
            <h2 class="text-2xl font-medium text-accent">Healthcare</h2>
            <p class="paragraph text-secondary">
              GDPR-compliant telemedicine & platforms
            </p>
          </button>
          <button
            class="industry-btn border-b w-full text-start py-2"
            data-index="3"
          >
            <h2 class="text-2xl font-medium text-accent">E-commerce</h2>
            <p class="paragraph text-secondary">Scalable digital marketplaces</p>
          </button>
          <button
            class="industry-btn border-b w-full text-start py-2"
            data-index="4"
          >
            <h2 class="text-2xl font-medium text-accent">Education Tech</h2>
            <p class="paragraph text-secondary">
              Learning platforms & LMS solutions
            </p>
          </button>
          <button
            class="industry-btn border-b w-full text-start py-2"
            data-index="5"
          >
            <h2 class="text-2xl font-medium text-accent">Sports Tech</h2>
            <p class="paragraph text-secondary">
              Analytics dashboards & fan engagement
            </p>
          </button>
          <button
            class="industry-btn border-b w-full text-start py-2"
            data-index="6"
          >
            <h2 class="text-2xl font-medium text-accent">Social Media</h2>
            <p class="paragraph text-secondary">
              High-performance community platforms
            </p>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const buttons = document.querySelectorAll(".industry-btn");
  const images = document.querySelectorAll(".industry-img");

  // Function to set active button and image
  function setActive(index) {
    // Hide all images
    images.forEach((img) => img.parentElement.classList.add("hidden"));

    // Show the selected image
    images[index].parentElement.classList.remove("hidden");

    // Reset all buttons to default text colors
    buttons.forEach((b) => {
      const title = b.querySelector("h2");
      const detail = b.querySelector("p");

      title.classList.remove("text-[#0094EE]");
      detail.classList.remove("text-[#0094EE]");

      title.classList.add("text-[#132028]");
      detail.classList.add("text-[#44464A]");
    });

    const activeTitle = buttons[index].querySelector("h2");
    const activeDetail = buttons[index].querySelector("p");

    activeTitle.classList.remove("text-[#132028]");
    activeDetail.classList.remove("text-[#44464A]");

    activeTitle.classList.add("text-[#0094EE]");
    activeDetail.classList.add("text-[#0094EE]");
  }

  setActive(0);

  buttons.forEach((btn, idx) => {
    btn.addEventListener("click", () => setActive(idx));
  });
</script>
