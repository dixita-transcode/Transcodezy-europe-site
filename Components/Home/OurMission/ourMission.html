<!-- Our Mission & Vision Section -->

    class="absolute inset-0 object-cover w-full h-full opacity-70 z-0 pointer-events-none"

  <img
    src="../../../Assets/Images/mission_bg-2.png"
    alt="mission-bg-right"
    class="absolute inset-0 object-cover w-full h-full opacity-70 z-0 pointer-events-none"

  <!-- Content Container -->

        <div

          <img
            src="../../../Assets/Images/mission_icon.png"
            alt="mission-icon"

            alt="vision-icon"
            class="h-12 w-12 sm:h-14 sm:w-14 mb-5 mx-0 transition-transform duration-500 hover:scale-110"
          />
          <h2
            class="heading text-accent font-medium mb-3 text-left"
          >
            Our Vision
          </h2>
          <p
            class="paragraph text-secondary max-w-[435px] mx-auto sm:mx-0 text-left"

            To be recognized as the leading IT partner in Europe, enabling
            enterprises across industries to thrive in the digital era.
          </p>

      </div>
