<section class="bg-[#FFFFFF] pb-[50px]">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div
      class="flex flex-col xl:flex-row items-center gap-[40px] xl:gap-[80px] h-auto min-h-[628px]"
    >
      <!-- Left Image -->
      <div class="w-full lg:w-1/2">
        <img
          src="../../../Assets/Images/ContactUs/contact_form_bg.jpg"
          alt="Team Collaboration"
          class="w-full h-[628px] rounded-tl-[440px] rounded-tr-[440px] rounded-br-[24px] rounded-bl-[24px] object-cover"
        />
      </div>

      <!-- Right Form -->
      <div
        class="relative z-0 bg-[#0F1A24] w-full max-w-3xl p-5 lg:p-10 rounded-[24px] min-h-[628px] w-full xl:w-[720px] shadow-lg"
      >
        <h2 class="text-white text-[32px] font-medium">
          Collaborate with Transcodezy
        </h2>
        <form class="space-y-6 relative z-10 py-3 lg:py-6">
          <!-- Row 1 -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <input
              type="text"
              placeholder="Full Name"
              class="w-full p-3 rounded-xl bg-[#FFFFFF14] text-[#FFFFFF66] placeholder-[#FFFFFF66] focus:outline-none focus:ring-2 focus:ring-primary z-10"
            />

            <input
              type="email"
              placeholder="Email Address"
              class="w-full p-3 rounded-xl bg-[#FFFFFF14] text-[#FFFFFF66] placeholder-[#FFFFFF66] focus:outline-none focus:ring-2 focus:ring-primary z-10"
            />
          </div>

          <!-- Row 2 -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <input
              type="text"
              placeholder="Company Name"
              class="w-full p-3 rounded-xl bg-[#FFFFFF14] text-[#FFFFFF66] placeholder-[#FFFFFF66] focus:outline-none focus:ring-2 focus:ring-primary z-10"
            />

            <!-- Position Applied Dropdown -->
            <input
              type="tel"
              placeholder="Phone Number"
              class="w-full p-3 rounded-xl bg-[#FFFFFF14] text-[#FFFFFF66] placeholder-[#FFFFFF66] focus:outline-none focus:ring-2 focus:ring-primary z-10"
            />
          </div>

          <!-- Row 3 -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- About your project -->
            <textarea
              placeholder="About your project..."
              class="w-full h-32 p-3 rounded-xl bg-[#FFFFFF14] text-white placeholder-[#FFFFFF66] focus:outline-none focus:ring-2 focus:ring-primary z-10"
            ></textarea>

            <!-- Attachments (Optional) -->
            <label class="rounded-xl cursor-pointer bg-[#FFFFFF14] p-3 z-10">
              <p class="text-md text-[#FFFFFF66] text-start mb-2">
                Attachments (Optional)
              </p>
              <div
                class="flex flex-col items-center justify-center w-full h-[70px] text-[#FFFFFF66] rounded-lg border-2 border-dashed border-gray-600 hover:border-primary transition"
              >
                <i class="fa-solid fa-arrow-up-from-bracket text-2xl"></i>
              </div>
              <input id="resume" type="file" class="hidden" />
            </label>
          </div>
          <div class=" space-y-3">
            <!-- Checkbox 1 -->
            <div class="form-group">
              <input type="checkbox" id="html">
              <label for="html" class="text-[#FFFFFF66]">I have read Privacy Notice</label>
            </div>

            <!-- Checkbox 2 -->
            <div class="form-group">
              <input type="checkbox" id="css">
              <label for="css" class="text-[#FFFFFF66]">I agree to receive marketing materials about news, events, and proposals from Transcodezy </label>
            </div>
          </div>
        </form>
        <div class="mt-3 w-fit px-6 py-3 bg-primary paragraph text-white rounded-[40px] hover:scale-110 duration-700 transition overflow-hidden">
            <a href="#" >Send Message</a>
        </div>
      </div>  
    </div>
  </div>
</section>
